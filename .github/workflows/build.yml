name: Build (Windows)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    # Guard: if this ever gets merged upstream, it will "skip" there.
    if: github.repository_owner == 'SAM-BIM'
    runs-on: windows-2022

    env:
      MSBUILDDISABLENODEREUSE: "1"
      ORG_NAME: "SAM-BIM"
      REPO_NAME: "SAM_Revit"
      CONFIGURATION: "Release"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ${{ env.REPO_NAME }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Use modern NuGet (avoid NuGet 4.x + MSBuild 17 parsing issues)
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: "6.x"

      - name: Clone dependency repos (siblings)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $org  = '${{ env.ORG_NAME }}'
          $repo = '${{ env.REPO_NAME }}'

          # Build order: deps first, current repo LAST
          # (Adjust if you discover more deps.)
          $buildOrder = @(
            'SAM'
            'SAM_Systems'
            'SAM_Windows'
            'SAM_Psychrometrics'
            'SAM_Mollier'
            'SAM_gbXML'
            'SAM_SolarCalculator'
            'SAM_Tas'
            'SAM_Excel'
            'SAM_GEM'
            'SAM_LadybugTools'
            'SAM_UI'
            'SAM_Revit'
            'SAM_Revit_UI'
            $repo
          ) | Select-Object -Unique

          foreach ($r in $buildOrder) {
            if ($r -eq $repo) { continue }   # already checked out by Actions
            if (Test-Path $r) { continue }

            Write-Host "Cloning https://github.com/$org/$r.git"
            git clone --depth 1 "https://github.com/$org/$r.git" $r
          }

      - name: Restore + Rebuild in order (NuGet restore + MSBuild)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cfg  = '${{ env.CONFIGURATION }}'

          function Find-Solution([string]$repoName) {
            $expected = Join-Path $repoName "$repoName.sln"
            if (Test-Path $expected) { return (Resolve-Path $expected).Path }

            $rootSln = Get-ChildItem -Path $repoName -Filter *.sln -File -ErrorAction SilentlyContinue |
                       Select-Object -First 1
            if ($rootSln) { return $rootSln.FullName }

            $anySln = Get-ChildItem -Path $repoName -Recurse -Filter *.sln -File -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -notmatch '\\(bin|obj|packages)\\' } |
                      Select-Object -First 1
            if ($anySln) { return $anySln.FullName }

            throw "No .sln found under: $repoName"
          }

          # Build order: deps first, current repo LAST
          $buildOrder = @(
            'SAM'
            'SAM_Systems'
            'SAM_Windows'
            'SAM_Psychrometrics'
            'SAM_Mollier'
            'SAM_gbXML'
            'SAM_SolarCalculator'
            'SAM_Tas'
            'SAM_Excel'
            'SAM_GEM'
            'SAM_LadybugTools'
            'SAM_UI'
            'SAM_Revit'
            'SAM_Revit_UI'
            '${{ env.REPO_NAME }}'
          ) | Select-Object -Unique

          # Resolve solution paths
          $solutionItems = foreach ($r in $buildOrder) {
            $slnPath = Find-Solution $r
            [pscustomobject]@{ Repo = $r; Sln = $slnPath }
          }

          # ReferencePath: must be a SINGLE msbuild argument (avoid MSB1006)
          $winBuild = Join-Path (Get-Location) 'SAM_Windows\build'
          $uiBuild  = Join-Path (Get-Location) 'SAM_UI\build'

          New-Item -ItemType Directory -Force -Path $winBuild | Out-Null
          New-Item -ItemType Directory -Force -Path $uiBuild  | Out-Null

          # One property with both folders separated by semicolon:
          $refPathArg = "/p:ReferencePath=`"$winBuild;$uiBuild`""

          # Common MSBuild args (ARRAY — do not join into one string)
          $msbuildCommon = @(
            '/m:1'
            '/nr:false'
            '/v:m'
            "/p:Configuration=$cfg"
            '/p:UseSharedCompilation=false'
            '/p:RunPostBuildEvent=OnOutputUpdated'
            $refPathArg
          )

          foreach ($it in $solutionItems) {
            Write-Host ""
            Write-Host "=== $($it.Repo) ==="
            Write-Host "Solution: $($it.Sln)"
            Write-Host "-> NuGet restore"
            & nuget restore $it.Sln -Verbosity detailed
            if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed: $($it.Repo)" }

            Write-Host "-> MSBuild Rebuild ($cfg)"
            & msbuild $it.Sln /t:Rebuild @msbuildCommon
            if ($LASTEXITCODE -ne 0) { throw "MSBuild rebuild failed: $($it.Repo)" }
          }

      - name: Upload build folders (optional)
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Revit-build-folders
          path: |
            **\build\*
          if-no-files-found: warn
