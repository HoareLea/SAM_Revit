name: Build (Windows)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    if: github.repository_owner == 'SAM-BIM'
    runs-on: windows-2022

    env:
      MSBUILDDISABLENODEREUSE: "1"
      ORG_NAME: "SAM-BIM"
      REPO_NAME: "SAM_Revit"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ${{ env.REPO_NAME }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: "6.x"

      - name: Clone dependency repos (siblings)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $org = 'SAM-BIM'
          $repo = 'SAM_Revit'

          $publicRepos = @(
            'SAM'
            'SAM_Systems'
            'SAM_Windows'
            'SAM_Mollier'
            'SAM_gbXML'
            'SAM_SolarCalculator'
            'SAM_Tas'
            'SAM_Excel'
            'SAM_GEM'
            'SAM_LadybugTools'
            'SAM_UI'
            $repo
          )

          foreach ($r in $publicRepos) {
            if (-not (Test-Path $r)) {
              git clone https://github.com/$org/$r.git $r
            }
          }

          if (-not (Test-Path 'SAM_Solver')) {
            git clone https://x-access-token:$env:GH_TOKEN@github.com/$org/SAM_Solver.git SAM_Solver
          }

          New-Item -ItemType Directory -Force -Path "SAM_Windows\build" | Out-Null
          New-Item -ItemType Directory -Force -Path "SAM_UI\build"      | Out-Null

      - name: Restore + Rebuild in order (shared _refs + Revit 2025/2026)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-Solution([string]$repoName) {
            $expected = Join-Path $repoName "$repoName.sln"
            if (Test-Path $expected) { return (Resolve-Path $expected).Path }

            $sln = Get-ChildItem -Path $repoName -Recurse -Filter *.sln -File |
                   Where-Object { $_.FullName -notmatch '\\(bin|obj|packages)\\' } |
                   Select-Object -First 1
            if ($sln) { return $sln.FullName }

            throw "No .sln found under: $repoName"
          }

          function Add-OutputsToRefs($repoName, $refsDir) {
            Get-ChildItem -Path $repoName -Recurse -Directory |
              Where-Object { $_.FullName -match '\\bin\\(x64\\)?Release' -or $_.Name -eq 'build' } |
              ForEach-Object {
                Copy-Item (Join-Path $_.FullName '*') $refsDir -Recurse -Force -ErrorAction SilentlyContinue
              }
          }

          $refs = Join-Path (Get-Location) "_refs"
          New-Item -ItemType Directory -Force -Path $refs | Out-Null
          $env:ReferencePath = $refs

          $buildOrder = @(
            'SAM'
            'SAM_Systems'
            'SAM_Psychrometrics'
            'SAM_Mollier'
            'SAM_Windows'
            'SAM_IFC'
            'SAM_Topologic'
            'SAM_BHom'
            'SAM_gbXML'
            'SAM_GEM'
            'SAM_LadybugTools'
            'SAM_Solver'
            'SAM_SolarCalculator'
            'SAM_Tas'
            'SAM_Excel'
            'SAM_SQLite'
            'SAM_OpenStudio'
            'SAM_UI'
          ) | Select-Object -Unique

          $platformByRepo = @{ 'SAM_OpenStudio' = 'x64' }

          function Build-RepoSln($repoName, $config) {
            $sln = Find-Solution $repoName
            nuget restore $sln
            $args = @(
              '/m:1'
              '/nr:false'
              "/p:Configuration=$config"
              '/p:RunPostBuildEvent=Never'
            )
            if ($platformByRepo.ContainsKey($repoName)) {
              $args += "/p:Platform=$($platformByRepo[$repoName])"
            }
            msbuild $sln /t:Rebuild @args
            Add-OutputsToRefs $repoName $refs
          }

          foreach ($r in $buildOrder) {
            Build-RepoSln $r 'Release'
          }

          foreach ($cfg in @('Release2025','Release2026')) {
            Build-RepoSln 'SAM_Revit' $cfg
            Build-RepoSln 'SAM_Revit_UI' $cfg
          }

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Revit-build-outputs
          path: |
            **\build\*
            _refs\*
          if-no-files-found: warn
