name: Build (Windows)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    # Guard: if this ever gets merged upstream (e.g. HoareLea),
    # it will be "skipped" there and won't break their CI.
    if: github.repository_owner == 'SAM-BIM'
    runs-on: windows-2022

    env:
      MSBUILDDISABLENODEREUSE: "1"
      ORG_NAME: "SAM-BIM"
      REPO_NAME: "SAM_Revit"
      CONFIGURATION: "Release"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ${{ env.REPO_NAME }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: "6.x"

      - name: Clone dependency repos (siblings)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $org  = '${{ env.ORG_NAME }}'
          $repo = '${{ env.REPO_NAME }}'

          # Build order: deps first, current repo LAST.
          # Keep this list as SMALL as possible; add only when compiler asks for it.
          $buildOrder = @(
            'SAM'
            'SAM_Systems'
            'SAM_Windows'
            'SAM_UI'
            $repo
          )

          foreach ($r in $buildOrder) {
            if ($r -eq $repo) { continue } # already checked out
            if (Test-Path $r) { continue }

            Write-Host "Cloning https://github.com/$org/$r.git"
            git clone --depth 1 "https://github.com/$org/$r.git" $r
          }

          # Ensure reference folders exist even before builds
          New-Item -ItemType Directory -Force -Path "SAM_Windows\build" | Out-Null
          New-Item -ItemType Directory -Force -Path "SAM_UI\build"      | Out-Null

      - name: Restore + Rebuild in order (safe ReferencePath)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg  = '${{ env.CONFIGURATION }}'
          $repo = '${{ env.REPO_NAME }}'

          function Find-Solution([string]$repoName) {
            $expected = Join-Path $repoName "$repoName.sln"
            if (Test-Path $expected) { return (Resolve-Path $expected).Path }

            $rootSln = Get-ChildItem -Path $repoName -Filter *.sln -File -ErrorAction SilentlyContinue |
                       Select-Object -First 1
            if ($rootSln) { return $rootSln.FullName }

            $anySln = Get-ChildItem -Path $repoName -Recurse -Filter *.sln -File -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -notmatch '\\(bin|obj|packages)\\' } |
                      Select-Object -First 1
            if ($anySln) { return $anySln.FullName }

            throw "No .sln found under: $repoName"
          }

          # Match the clone step build order
          $buildOrder = @(
            'SAM'
            'SAM_Systems'
            'SAM_Windows'
            'SAM_UI'
            $repo
          ) | Select-Object -Unique

          $solutionItems = foreach ($r in $buildOrder) {
            $slnPath = Find-Solution $r
            [pscustomobject]@{ Repo = $r; Sln = $slnPath }
          }

          # SAFE ReferencePath: environment variable, no quoting issues with WinMD
          $winBuild = (Resolve-Path 'SAM_Windows\build').Path
          $uiBuild  = (Resolve-Path 'SAM_UI\build').Path
          $env:ReferencePath = "$winBuild;$uiBuild"
          Write-Host "ReferencePath=$env:ReferencePath"

          $msbuildCommon = @(
            '/m:1'
            '/nr:false'
            '/v:m'
            "/p:Configuration=$cfg"
            '/p:UseSharedCompilation=false'
            '/p:RunPostBuildEvent=OnOutputUpdated'
          )

          foreach ($it in $solutionItems) {
            Write-Host ""
            Write-Host "=== $($it.Repo) ==="
            Write-Host "Solution: $($it.Sln)"

            Write-Host "-> NuGet restore"
            & nuget restore $it.Sln -Verbosity detailed
            if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed: $($it.Repo)" }

            Write-Host "-> MSBuild rebuild ($cfg)"
            & msbuild $it.Sln /t:Rebuild @msbuildCommon
            if ($LASTEXITCODE -ne 0) { throw "MSBuild rebuild failed: $($it.Repo)" }
          }

      - name: Upload build folders (optional)
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Revit-build-folders
          path: |
            **\build\*
          if-no-files-found: warn
